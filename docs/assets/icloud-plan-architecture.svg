  <text x="38" y="280" font-size="12" font-weight="600" fill="#6b7280">防护层 · Tauri 命令（app/src-tauri）</text>
  <rect x="44" y="296" width="268" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
