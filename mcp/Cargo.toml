[package]
name = "open-llm-wiki-mcp"
version = "0.1.0"
description = "Open LLM Wiki MCP server — stdio tools over open-llm-wiki-core + vault fs"
authors = ["Open LLM Wiki contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_llm_wiki_mcp"
path = "src/lib.rs"

[[bin]]
name = "open-llm-wiki-mcp"
path = "src/main.rs"

[dependencies]
open-llm-wiki-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
# preserve_order:upsert agent 配置(如 ~/.claude.json 这类多 MB 活体状态文件)
# 时不得重排用户键序——解析→插键→序列化保持原顺序。
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
# 本地 agent 探测(PATH 二进制);MIT。
which = "7"
# Codex config.toml 保格式/保注释 upsert;MIT OR Apache-2.0。
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
