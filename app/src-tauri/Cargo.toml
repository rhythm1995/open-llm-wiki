[package]
name = "openobs-app"
version = "0.1.0"
description = "OpenObsidian desktop app — Tauri shell over openobs-core"
authors = ["OpenObsidian contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openobs_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# 纯逻辑大脑:path 依赖同 workspace 的 core。
openobs-core = { path = "../../core" }
