[package]
name = "openobs-mcp"
version = "0.1.0"
description = "OpenObsidian MCP server — stdio tools over openobs-core + vault fs"
authors = ["OpenObsidian contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "openobs-mcp"
path = "src/main.rs"

[dependencies]
openobs-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
