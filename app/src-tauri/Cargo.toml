[package]
name = "openobs-app"
version = "0.1.0"
description = "OpenObsidian desktop app — Tauri shell over openobs-core"
authors = ["OpenObsidian contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openobs_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"
# 纯逻辑大脑:path 依赖同 workspace 的 core。
openobs-core = { path = "../../core" }
# Agent 记忆接入(B-MCP-ONBOARD):Settings 面板复用 mcp 侧的探测/接线/播种逻辑(lib 面)。
openobs-mcp = { path = "../../mcp" }
# 应用内 Agent(ACP 托管,doc 11 / Phase 7)。
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-util", "process"] }
which = "7"
# Agent 转录持久化(B-AGENT-TRANSCRIPT):每 vault 一 db,bundled 免系统 sqlite。
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# 临时 vault 目录:git 集成测试(真实 round-trip 过系统 git)。
tempfile = "3"
