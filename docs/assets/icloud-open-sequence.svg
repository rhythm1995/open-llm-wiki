<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="860" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">打开资料库 — 存储检测与防护时序</text>
  <rect x="40" y="56" width="60" height="30" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="70" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">用户</text>
  <line x1="70" y1="86" x2="70" y2="830" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="195" y="56" width="110" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="250" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">UI 前端</text>
  <line x1="250" y1="86" x2="250" y2="830" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="415" y="56" width="150" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="490" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">命令层 src-tauri</text>
  <line x1="490" y1="86" x2="490" y2="830" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="665" y="56" width="150" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="740" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">文件系统 + iCloud</text>
  <line x1="740" y1="86" x2="740" y2="830" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="880" y="56" width="80" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="920" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Git</text>
  <line x1="920" y1="86" x2="920" y2="830" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="128" x2="250" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="140" y="112" width="40" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="160" y="124" text-anchor="middle" font-size="11" fill="#2563eb">打开资料库</text>
  <line x1="250" y1="174" x2="490" y2="174" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="315" y="158" width="110" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="170" text-anchor="middle" font-size="11" fill="#2563eb">open_vault(root)</text>
  <path d="M 490,206 L 528,206 L 528,230 L 498,230" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="536" y="222" font-size="11" fill="#2563eb">detect_storage（路径判定）</text>
  <line x1="490" y1="286" x2="250" y2="286" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <rect x="267" y="270" width="206" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="282" text-anchor="middle" font-size="11" fill="#6b7280">storage-kind 事件（kind / evicted）</text>
  <rect x="60" y="306" width="790" height="118" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="60" y="306" width="133" height="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="66" y="320" font-size="11" font-weight="600" fill="#374151">alt [kind = icloud]</text>
  <line x1="490" y1="340" x2="740" y2="340" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="531" y="324" width="168" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="615" y="336" text-anchor="middle" font-size="11" fill="#2563eb">采样 SF_DATALESS / *.icloud</text>
  <line x1="740" y1="376" x2="490" y2="376" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <rect x="579" y="360" width="72" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="615" y="372" text-anchor="middle" font-size="11" fill="#6b7280">evicted 计数</text>
  <line x1="250" y1="404" x2="70" y2="404" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="108" y="388" width="104" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="160" y="400" text-anchor="middle" font-size="11" fill="#2563eb">横幅：保持下载 · 勿同时编辑</text>
  <rect x="200" y="444" width="760" height="112" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="200" y="444" width="95" height="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="206" y="458" font-size="11" font-weight="600" fill="#374151">alt [.git 存在]</text>
  <line x1="490" y1="478" x2="920" y2="478" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="602" y="462" width="206" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="705" y="474" text-anchor="middle" font-size="11" fill="#2563eb">rev-parse --is-inside-work-tree</text>
  <line x1="490" y1="530" x2="250" y2="530" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <rect x="309" y="514" width="123" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="526" text-anchor="middle" font-size="11" fill="#6b7280">git 防护：自动提交默认关（可改）</text>
  <line x1="250" y1="588" x2="490" y2="588" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="312" y="572" width="116" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="584" text-anchor="middle" font-size="11" fill="#2563eb">watch_vault(root)</text>
  <line x1="490" y1="630" x2="250" y2="630" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <rect x="267" y="614" width="206" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="626" text-anchor="middle" font-size="11" fill="#6b7280">vault-changed（350ms + 500ms 去抖）</text>
  <line x1="70" y1="672" x2="250" y2="672" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="140" y="656" width="40" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="160" y="668" text-anchor="middle" font-size="11" fill="#2563eb">编辑并保存</text>
  <line x1="250" y1="714" x2="490" y2="714" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="306" y="698" width="129" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="370" y="710" text-anchor="middle" font-size="11" fill="#2563eb">write_note(content)</text>
  <line x1="490" y1="756" x2="740" y2="756" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="551" y="740" width="129" height="17" fill="#ffffff" opacity="0.95"/>
  <text x="615" y="752" text-anchor="middle" font-size="11" fill="#2563eb">写 .tmp → rename（原子）</text>
  <path d="M 740,786 L 778,786 L 778,810 L 748,810" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="786" y="802" font-size="11" fill="#2563eb">bird 上传完整文件</text>
  <g transform="translate(70,842)">
    <line x1="0" y1="6" x2="26" y2="6" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
    <text x="32" y="10" font-size="11" fill="#6b7280">同步调用</text>
    <line x1="110" y1="6" x2="136" y2="6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ag)"/>
    <text x="142" y="10" font-size="11" fill="#6b7280">事件 / 返回</text>
  </g>
</svg>