name: CI

# 持续集成:每次 push / PR 跑核心逻辑测试 + 类型检查 + UI 测试 + App 集成测试。
# 分两个 job 节省成本与失败隔离:
#   core-and-ui —— 跑在便宜的 ubuntu 上(open-llm-wiki-core 纯逻辑无系统依赖 + UI 纯 node)。
#   app         —— 跑在 macOS 上(open-llm-wiki-app 编译 tauri,需 webkit;git_tests 依赖系统 git)。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install frontend deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Core logic tests (open-llm-wiki-core)
        run: cargo test -p open-llm-wiki-core

      - name: MCP server tests (open-llm-wiki-mcp)
        run: cargo test -p open-llm-wiki-mcp

      - name: Skills installer tests
        run: node --test packages/open-llm-wiki-skills/test/*.test.mjs

      - name: Site lib tests
        run: |
          pnpm --dir site install --frozen-lockfile
          pnpm --dir site test

      - name: UI typecheck
        run: pnpm --dir ui typecheck

      - name: UI tests (vitest, coverage gated)
        run: pnpm --dir ui test:cov

  app:
    # open-llm-wiki-app 编译 tauri 2:macOS 无需额外系统包(webkit 随 Xcode toolchain 提供),
    # 且 git_tests 依赖系统 git(macOS 自带)。ubuntu 上 tauri 编译需 webkit2gtk-4.1 等,
    # 故把 App 测试放 macOS 跑最省心。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install frontend deps
        run: pnpm --dir ui install --frozen-lockfile

      # tauri-build(build.rs)在校验配置时可能读 frontendDist,先产出 ui/dist 更稳。
      - name: Build frontend (ui/dist)
        run: pnpm --dir ui build

      # tauri-build(build.rs)校验 externalBin:必须先把 mcp sidecar 构建并放进
      # app/src-tauri/binaries/。本地能过是历史产物掩盖了这一步;全新环境(如 CI)
      # 直接 cargo test -p open-llm-wiki-app 会在 build.rs 阶段失败。
      - name: Stage MCP sidecar binary (tauri externalBin)
        run: |
          cargo build -p open-llm-wiki-mcp --release
          mkdir -p app/src-tauri/binaries
          cp target/release/open-llm-wiki-mcp \
            "app/src-tauri/binaries/open-llm-wiki-mcp-$(rustc -vV | sed -n 's|host: ||p')"

      - name: App integration tests (open-llm-wiki-app, incl. git_tests)
        run: cargo test -p open-llm-wiki-app

  ios-compile:
    # iOS 交叉编译门(doc 18 M2):cfg(desktop) 门与 tauri.ios.conf.json 的
    # externalBin 覆盖保证本 job 无需 mcp sidecar(本地已验证 build.rs 重跑通过)。
    # 不做签名/打包 —— 无签名模拟器构建见 ios.yml,TestFlight 属 M3 凭证门。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install frontend deps
        run: pnpm --dir ui install --frozen-lockfile

      # generate_context! 编译期读 frontendDist,先产出 ui/dist。
      - name: Build frontend (ui/dist)
        run: pnpm --dir ui build

      - name: iOS cross-compile check
        run: cargo check --target aarch64-apple-ios -p open-llm-wiki-app

  e2e:
    # 前端集成 e2e:web mock 模式(无 Tauri runtime),只需 chromium + vite dev server。
    # 覆盖组件协作 / store 生命周期 / UI 关键路径;真后端(core/app)信心来自上面两个 job。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: E2E (web mock)
        run: pnpm --dir ui exec playwright test
