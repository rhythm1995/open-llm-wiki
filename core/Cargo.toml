[package]
name = "open-llm-wiki-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Open LLM Wiki core: pure, IO-free parsing / graph / query logic"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# index 切片起需要:YAML 解析(serde_yaml)。
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
# 属性测试(解析器防 panic)。
proptest = "1"
# QQL 差分 fixture(JSON)。
serde_json = "1"
