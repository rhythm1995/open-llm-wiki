name: Site

# Isolated from core-and-ui / app / e2e. Only the marketing site + user-doc renderer.
on:
  push:
    paths:
      - "site/**"
      - "docs/user/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/user/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir site install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir site typecheck

      - name: Build
        run: pnpm --dir site build
        env:
          SITE_BASE: /open-llm-wiki/

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.1.0'))
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
