  <text x="178.0" y="337.0" text-anchor="middle" font-size="11" fill="#6b7280">路径判定 → storage_kind</text>
  <rect x="332" y="296" width="268" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="466.0" y="319.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">atomic_write</text>
  <text x="466.0" y="337.0" text-anchor="middle" font-size="11" fill="#6b7280">同目录 tmp → rename</text>
  <rect x="620" y="296" width="268" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
