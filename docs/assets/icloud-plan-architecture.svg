<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">iCloud 存储支持 — 产品三层架构</text>
  <rect x="24" y="56" width="856" height="150" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="38" y="78" font-size="12" font-weight="600" fill="#6b7280">入口层 · 前端 UI（ui/）</text>
  <rect x="44" y="96" width="196" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="142.0" y="120.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">欢迎屏 · 存储三选一</text>
  <text x="142.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b7280">iCloud / 本机 / 现有</text>
  <rect x="264" y="96" width="196" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="362.0" y="120.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">目录选择器</text>
  <text x="362.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b7280">iCloud Drive 快捷入口</text>
  <rect x="484" y="96" width="196" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="582.0" y="120.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Git 面板</text>
  <text x="582.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b7280">防护状态与开关</text>
  <rect x="704" y="96" width="196" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="802.0" y="120.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">提示横幅</text>
  <text x="802.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b7280">一次性 · 不打扰</text>
